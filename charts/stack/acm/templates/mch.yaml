apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  {{- if $.Values.mch_annotations }}
  annotations:
    {{- tpl (toYaml $.Values.mch_annotations) $ | nindent 4 }}
  {{- end }}
  labels:
    {{- include "common.labels.labels" $ | nindent 4 }}
  {{- if $.Values.mch_labels }}
    {{- tpl (toYaml $.Values.mch_labels) $ | nindent 4 }}
  {{- end }}
  name: {{ $.Values.mch_name }}
  namespace: {{ $.Values.mch_namespace }}
spec:
  availabilityConfig: {{ $.Values.mch_availability_config }}
  enableClusterBackup: {{ $.Values.mch_enable_cluster_backup }}
  imagePullSecret: {{ $.Values.mch_pull_secret_name }}
  ingress: {}
  {{- if $.Values.global.use_infra_nodes }}
  nodeSelector:
    node-role.kubernetes.io/infra: ""
  {{- end }}
  overrides:
    components:
      - configOverrides: {}
        enabled: true
        name: app-lifecycle
      - configOverrides: {}
        enabled: true
        name: cluster-lifecycle
      - configOverrides: {}
        enabled: true
        name: cluster-permission
      - configOverrides: {}
        enabled: true
        name: console
      - configOverrides: {}
        enabled: true
        name: grc
      - configOverrides: {}
        enabled: true
        name: insights
      - configOverrides: {}
        enabled: true
        name: multicluster-engine
      - configOverrides: {}
        enabled: true
        name: multicluster-observability
      - configOverrides: {}
        enabled: true
        name: search
      - configOverrides: {}
        enabled: true
        name: submariner-addon
      - configOverrides: {}
        enabled: true
        name: volsync
      - configOverrides: {}
        enabled: false
        name: cluster-backup
      - configOverrides: {}
        enabled: true
        name: siteconfig
  separateCertificateManagement: {{ $.Values.mch_separate_certificate_management }}
  {{- if $.Values.global.use_infra_nodes }}
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/infra
      value: reserved
    - effect: NoExecute
      key: node-role.kubernetes.io/infra
      value: reserved
  {{- end }}
