---
definitions:
  - config: |
      {
        "cniVersion": "0.3.1",
        "ipam": {},
        "name": "vlan-100",
        "netAttachDefName": "default/vlan-100",
        "topology": "localnet",
        "type": "ovn-k8s-cni-overlay",
        "vlanID": 100
      }
    name: vlan-100
    namespace: default
  - config: |
      {
        "cniVersion": "0.3.1",
        "ipam": {},
        "name": "vlan-800",
        "netAttachDefName": "default/vlan-800",
        "topology": "localnet",
        "type": "ovn-k8s-cni-overlay",
        "vlanID": 800
      }
    name: vlan-800
    namespace: default
policies:
  - desiredState:
      interfaces:
        - ipv4:
            enabled: false
          ipv6:
            enabled: false
          name: ens1f0np0
          state: up
          type: ethernet
        - bridge:
            allow-extra-patch-ports: true
            options:
              stp: true
            port:
              - name: ens1f0np0
          name: ovs-br1
          state: up
          type: ovs-bridge
      ovn:
        bridge-mappings:
          - bridge: ovs-br1
            localnet: vlan-100
            state: present
          - bridge: ovs-br1
            localnet: vlan-800
            state: present
    name: ovs-br1-metal
    nodeSelector:
      node-role.kubernetes.io/control-plane: ''
  - desiredState:
      interfaces:
        - ipv4:
            addresses:
              - ip: 172.16.90.31
                prefix-length: 24
            dhcp: false
            enabled: true
          ipv6:
            enabled: false
          name: ens1f1np1
          state: up
          type: ethernet
    name: cp0-bgp-interface
    nodeSelector:
      kubernetes.io/hostname: cp0.warden.lab.uc2.io
  - desiredState:
      interfaces:
        - ipv4:
            addresses:
              - ip: 172.16.90.32
                prefix-length: 24
            dhcp: false
            enabled: true
          ipv6:
            enabled: false
          name: ens1f1np1
          state: up
          type: ethernet
    name: cp1-bgp-interface
    nodeSelector:
      kubernetes.io/hostname: cp1.warden.lab.uc2.io
  - desiredState:
      interfaces:
        - ipv4:
            addresses:
              - ip: 172.16.90.33
                prefix-length: 24
            dhcp: false
            enabled: true
          ipv6:
            enabled: false
          name: ens1f1np1
          state: up
          type: ethernet
    name: cp2-bgp-interface
    nodeSelector:
      kubernetes.io/hostname: cp2.warden.lab.uc2.io
