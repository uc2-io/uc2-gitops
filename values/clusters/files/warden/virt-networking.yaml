---
definitions:
  - config: |
      {
        "cniVersion": "0.3.1",
        "ipam": {},
        "name": "vlan-100",
        "netAttachDefName": "default/vlan-100",
        "topology": "localnet",
        "type": "ovn-k8s-cni-overlay",
        "vlanID": 100
      }
    name: vlan-100
    namespace: default
  - config: |
      {
        "cniVersion": "0.3.1",
        "ipam": {},
        "name": "vlan-800",
        "netAttachDefName": "default/vlan-800",
        "topology": "localnet",
        "type": "ovn-k8s-cni-overlay",
        "vlanID": 800
      }
    name: vlan-800
    namespace: default
policies:
  - desiredState:
      interfaces:
        - ipv4:
            enabled: false
          ipv6:
            enabled: false
          name: ens1f0np0
          state: up
          type: ethernet
        - bridge:
            allow-extra-patch-ports: true
            options:
              stp: true
            port:
              - name: ens1f0np0
          name: ovs-br1
          state: up
          type: ovs-bridge
      ovn:
        bridge-mappings:
          - bridge: ovs-br1
            localnet: vlan-100
            state: present
          - bridge: ovs-br1
            localnet: vlan-800
            state: present
    name: ovs-br1-metal
    nodeSelector:
      node-role.kubernetes.io/control-plane: ''
  - desiredState:
      interfaces:
        - ethtool:
            coalesce:
              adaptive-rx: true
              adaptive-tx: true
            ring:
              rx: 8192
              tx: 8192
          ipv4:
            address:
              - ip: 172.16.100.10
                prefix-length: 24
            dhcp: false
            enabled: true
          ipv6:
            enabled: false
          mtu: 9216
          name: ens3f1np1
          state: up
          type: ethernet
      routes:
        config:
          - destination: 172.16.100.0/24
            metric: 150
            next-hop-interface: ens3f1np1
            table-id: 254
    name: cp0-storage
    nodeSelector:
      kubernetes.io/hostname: cp0.warden.lab.uc2.io
  - desiredState:
      interfaces:
        - ethtool:
            coalesce:
              adaptive-rx: true
              adaptive-tx: true
            ring:
              rx: 8192
              tx: 8192
          ipv4:
            address:
              - ip: 172.16.100.11
                prefix-length: 24
            dhcp: false
            enabled: true
          ipv6:
            enabled: false
          mtu: 9216
          name: ens3f1np1
          state: up
          type: ethernet
      routes:
        config:
          - destination: 172.16.100.0/24
            metric: 150
            next-hop-interface: ens3f1np1
            table-id: 254
    name: cp1-storage
    nodeSelector:
      kubernetes.io/hostname: cp1.warden.lab.uc2.io
  - desiredState:
      interfaces:
        - ethtool:
            coalesce:
              adaptive-rx: true
              adaptive-tx: true
            ring:
              rx: 8192
              tx: 8192
          ipv4:
            address:
              - ip: 172.16.100.12
                prefix-length: 24
            dhcp: false
            enabled: true
          ipv6:
            enabled: false
          mtu: 9216
          name: ens3f1np1
          state: up
          type: ethernet
      routes:
        config:
          - destination: 172.16.100.0/24
            metric: 150
            next-hop-interface: ens3f1np1
            table-id: 254
    name: cp2-storage
    nodeSelector:
      kubernetes.io/hostname: cp2.warden.lab.uc2.io
